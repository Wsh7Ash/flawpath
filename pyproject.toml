[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flawpath"
version = "1.0.0"
description = "50 validated backend implementation skills plus a flawplan CLI for authorized assessment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wsh7Ash" }]
keywords = ["api-security", "backend", "agent-skills", "security", "mass-assignment"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
flawpath = "flawpath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"